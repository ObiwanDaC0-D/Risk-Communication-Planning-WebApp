services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: local_development_only
    volumes:
      - planner_data:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      retries: 15
  api:
    build: .
    env_file: .env
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    command: npm run dev
    environment:
      - VITE_API_URL=http://localhost:3001
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  planner_data:
